[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secposture"
version = "1.0.0"
description = "Host and service security posture auditor: benchmarks Linux systems you run against hardening controls and known-vulnerability data, and reports prioritized remediation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikola Levenov" }]
requires-python = ">=3.10"
keywords = ["security", "hardening", "cis-benchmark", "audit", "compliance", "vulnerability-management", "blue-team"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "paramiko>=3.4",
    "packaging>=23.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "pandas>=2.1", "plotly>=5.20"]
dev = ["pytest>=8.0", "ruff>=0.4", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
secposture = "secposture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secposture = ["data/*.yaml", "data/advisories/*.json", "report/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# "/tmp" appears only as literal text inside the /tmp-mount hardening control.
"src/secposture/controls/filesystem.py" = ["S108"]
# Status.PASS is an enum member, not a credential.
"src/secposture/models.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["secposture"]
known-local-folder = ["helpers", "conftest"]

[tool.bandit]
exclude_dirs = ["tests"]
# B108/B104: the "/tmp" paths and "0.0.0.0" literals appear only as detection
# text inside hardening controls. This tool never creates a temp file or binds
# a socket, so neither rule can apply to it.
# B105 also fires on hex colour codes and ANSI escapes in the report dicts;
# this project holds no credential literals (SSH password comes from getpass/env).
skips = ["B108", "B104", "B105"]
