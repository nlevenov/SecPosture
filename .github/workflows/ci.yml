name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,dashboard]"
      - run: ruff check src tests
      - name: Tests (root, so the SSH integration test runs)
        run: sudo -E env "PATH=$PATH" python -m pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - run: bandit -q -c pyproject.toml -r src
      - run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secposture:ci .
      - name: Runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id secposture:ci -u)" = "10001"
      - name: Audits a host and lists controls
        run: |
          docker run --rm secposture:ci controls | tee out.txt
          grep -q "controls" out.txt
